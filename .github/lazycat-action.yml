version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/memoh.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: server

build:
  run_buildscript: false

images:
  - id: server
    target: service
    service: server
    source: memohai/server
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

  - id: web
    target: service
    service: web
    source: memohai/web
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Memoh
    summary: "开源多 Agent 平台：独立沙箱、长期记忆"
